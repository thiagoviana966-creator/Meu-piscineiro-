<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Piscinas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f6fa;
      color: #17212b;
    }

    header {
      background: #0879d1;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 12px;
      font-size: 19px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5dd;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      background: #0879d1;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0565ad;
    }

    .casa {
      border-left: 5px solid #0879d1;
      background: #f7fafc;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .casa strong {
      display: block;
      margin-bottom: 5px;
    }

    .vazia {
      color: #66727d;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>💧 Organizador de Piscinas</h1>
    <p>Casas, tarefas e próximas visitas</p>
  </header>

  <main>

    <div class="card">
      <h2>➕ Adicionar casa</h2>

      <input
        type="text"
        id="nomeCasa"
        placeholder="Nome da casa ou cliente"
      >

      <input
        type="text"
        id="endereco"
        placeholder="Endereço"
      >

      <textarea
        id="observacao"
        placeholder="Observações"
      ></textarea>

      <button onclick="adicionarCasa()">
        Adicionar casa
      </button>
    </div>

    <div class="card">
      <h2>🏠 Minhas casas</h2>

      <div id="listaCasas">
        <div class="vazia">
          Nenhuma casa cadastrada.
        </div>
      </div>
    </div>

  </main>

  <script>
    let casas = JSON.parse(localStorage.getItem("casas")) || [];

    function salvarCasas() {
      localStorage.setItem("casas", JSON.stringify(casas));
    }

    function adicionarCasa() {
      const nome = document.getElementById("nomeCasa").value.trim();
      const endereco = document.getElementById("endereco").value.trim();
      const observacao = document.getElementById("observacao").value.trim();

      if (!nome) {
        alert("Digite o nome da casa ou cliente.");
        return;
      }

      const casa = {
        id: Date.now(),
        nome: nome,
        endereco: endereco,
        observacao: observacao,
        tarefas: [],
        arquivada: false
      };

      casas.push(casa);
      salvarCasas();

      document.getElementById("nomeCasa").value = "";
      document.getElementById("endereco").value = "";
      document.getElementById("observacao").value = "";

      mostrarCasas();
    }

    function mostrarCasas() {
      const lista = document.getElementById("listaCasas");

      const ativas = casas.filter(casa => !casa.arquivada);

      if (ativas.length === 0) {
        lista.innerHTML = '<div class="vazia">Nenhuma casa cadastrada.</div>';
        return;
      }

      lista.innerHTML = "";

      ativas.forEach(casa => {
        const div = document.createElement("div");
        div.className = "casa";

        div.innerHTML = `
          <strong>🏠 ${casa.nome}</strong>
          <div>📍 ${casa.endereco || "Endereço não informado"}</div>
          <div>📝 ${casa.observacao || "Sem observações"}</div>
        `;

        lista.appendChild(div);
      });
    }

    mostrarCasas();
  </script>

</body>
</html>
